name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: dotnet tool restore

      - name: Type-check the generator
        run: npm run check:generator

      - name: Generated bindings match the generator
        run: |
          npm run generate
          git diff --exit-code -- src/Fable.Three/Three.fs src/Fable.Three/Three.Addons.fs

      - name: Build
        run: dotnet build src/Fable.Three -c Release -warnaserror

      - name: Test (Fable + node:test against three.js)
        run: npm test

      - name: Build the demo
        run: npm run demo:build

      - name: Pack
        run: dotnet pack src/Fable.Three -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: demo/dist

  # Publishes the demo to GitHub Pages once Pages is enabled for the repository
  # (Settings > Pages > Source: GitHub Actions).
  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
