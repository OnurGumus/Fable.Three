name: Release

# Push a tag named after the package version (v0.186.0) to publish to NuGet.
#
# Publishing uses nuget.org Trusted Publishing: no API key is stored anywhere. GitHub issues
# this job a short-lived OIDC token, nuget.org checks it against the trusted publishing
# policy for this repository and workflow file, and hands back an API key valid for an hour.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token nuget.org exchanges for a temporary API key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: dotnet tool restore
      - run: npm test

      - name: Tag matches the package version
        run: |
          version=$(dotnet msbuild src/Fable.Three -getProperty:Version)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but package version $version"; exit 1; }

      - run: dotnet pack src/Fable.Three -c Release -o artifacts

      # Requested just before the push: the key it returns lives for an hour.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ReverseBlade # nuget.org profile name, not an email address

      - name: NuGet push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
